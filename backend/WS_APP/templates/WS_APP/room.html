{% extends "core_APP/base.html" %}

{% load static %}

{% block title %}Room {{ room.uuid }}{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{% static 'WS_APP/style.css' %}">
    <script src="{% static 'WS_APP/room.js' %}" defer></script>
{% endblock %}

{% block body %}
<div class="room" data-room-uuid="{{ room.uuid }}">

    <!-- Main media stage -->
    <main class="room-stage">

        <!-- Screen share -->
        <section class="screen-stage">
            <video
                id="screen-video"
                autoplay
                playsinline
            ></video>

            <div class="screen-placeholder" id="screen-placeholder">
                <span>No screen is being shared</span>
            </div>
        </section>

        <!-- Participant videos -->
        <section class="video-layer" id="video-layer">

            <!-- Local video -->
            <div class="video-tile local-video">
                <video
                    id="local-video"
                    autoplay
                    muted
                    playsinline
                ></video>

                <span class="participant-name">
                    You
                </span>
            </div>

            <!-- Remote videos will be inserted here -->

        </section>

        <!-- Room information -->
        <div class="room-info">
            <span>Room</span>
            <strong>{{ room.uuid }}</strong>
        </div>

    </main>


    <footer class="room-controls">
        <div class="controls-left">

            <button
                type="button"
                class="control-btn"
                id="mic-btn"
                title="Mute microphone"
                aria-label="Mute microphone"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z"/>
                    <path d="M19 11a7 7 0 0 1-14 0"/>
                    <path d="M12 18v4"/>
                    <path d="M8 22h8"/>
                </svg>
            </button>

            <button
                type="button"
                class="control-btn"
                id="camera-btn"
                title="Turn camera off"
                aria-label="Turn camera off"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M15 10l4.5-3v10L15 14"/>
                    <rect x="3" y="6" width="12" height="12" rx="2"/>
                </svg>
            </button>

            <button
                type="button"
                class="control-btn share-btn"
                id="screen-share-btn"
                title="Share screen"
                aria-label="Share screen"
            >
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="14" rx="2"/>
                    <path d="M8 21h8"/>
                    <path d="M12 17v4"/>
                    <path d="m9 10 3-3 3 3"/>
                    <path d="M12 7v6"/>
                </svg>
            </button>

        </div>


        <div class="controls-right">

            <button
                type="button"
                class="control-btn"
                id="participants-btn"
                title="Participants"
                aria-label="Participants"
            >
                <svg viewBox="0 0 24 24">
                    <circle cx="9" cy="8" r="3"/>
                    <path d="M3 20a6 6 0 0 1 12 0"/>
                    <circle cx="17" cy="9" r="2"/>
                    <path d="M17 14a4 4 0 0 1 4 4"/>
                </svg>
            </button>

            <button
                type="button"
                class="control-btn"
                id="chat-btn"
                title="Chat"
                aria-label="Chat"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 3v-6.5A7.5 7.5 0 1 1 20 11.5Z"/>
                </svg>
            </button>

            <button
                type="button"
                class="control-btn leave-btn"
                id="leave-btn"
                title="Leave room"
                aria-label="Leave room"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M10 17l5-5-5-5"/>
                    <path d="M15 12H3"/>
                    <path d="M21 19V5a2 2 0 0 0-2-2h-6"/>
                </svg>
            </button>
        </div>
    </footer>

    <aside class="chat-panel" id="chat-panel">

        <div class="chat-messages" id="chat-messages">
        </div>

        <form class="chat-input" id="chat-form">

            <input
                type="text"
                id="chat-message"
                placeholder="Message..."
                autocomplete="off"
            >

            <button type="submit" aria-label="Send message" title="Send">
                <svg viewBox="0 0 24 24">
                    <path d="m22 2-7 20-4-9-9-4Z"/>
                    <path d="M22 2 11 13"/>
                </svg>
            </button>

        </form>

    </aside>


    <!-- Participants panel -->
    <aside
        class="participants-panel"
        id="participants-panel"
    >

        <div class="participants-header">
            <span>Participants</span>

            <button
                type="button"
                id="close-participants-btn"
            >
                ×
            </button>
        </div>

        <div
            class="participants-list"
            id="participants-list"
        >
            <!-- Participants inserted by JS -->
        </div>

    </aside>

</div>

{% endblock %}
